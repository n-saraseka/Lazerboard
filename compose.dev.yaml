networks:
  main:

services:
  migrations:
    build:
      context: ./Backend
      dockerfile: ./Lazerboard.Data/Dockerfile
    depends_on:
      "db":
        condition: service_healthy
    env_file:
      - .env
    restart: on-failure:1
    networks:
      - main

  scorefetcher:
    build:
      context: ./Backend
      dockerfile: ./Lazerboard.ScoreFetcher/Dockerfile
    depends_on:
      "migrations":
        condition: service_completed_successfully
      "redis":
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:8081
    volumes:
      - ./logs/scorefetcher:/app/Logs
      - ./BeatmapCache:/app/BeatmapCache
    restart: unless-stopped
    networks:
      - main
  
  discordhooks:
    build:
      context: ./Backend
      dockerfile: ./Lazerboard.DiscordHooks/Dockerfile
    depends_on:
      "migrations":
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./logs/discordhooks:/app/Logs
    restart: unless-stopped
    networks:
      - main

  backend:
    build:
      context: ./Backend
      dockerfile: ./Lazerboard/Dockerfile
    depends_on:
      "migrations":
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./logs/backend:/app/Logs
      - ./keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
    networks:
      - main
  
  frontend:
    build:
      context: ./Frontend
    depends_on:
      "backend":
        condition: service_started
    volumes:
      - ./Caddy/data:/data
      - ./Caddy/config:/config
      - ./Caddy/dev.Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - main
  
  redis:
    image: redis:8-alpine
    env_file:
      - .env
    volumes:
      - ./redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: |
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    networks:
      - main
  
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    volumes:
      - ./db:/data/postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - main