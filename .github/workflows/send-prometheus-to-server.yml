name: Send new Prometheus configuration to server
on:
  push:
    branches: [ "master" ]
    paths: [ "prometheus.yml" ]
  workflow_dispatch:

jobs:
  create:
    name: create file
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v3
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: copy prometheus.yml to server
        shell: bash
        run: |
          scp ./prometheus.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WORK_DIR }}/prometheus.yml
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-post-deploy