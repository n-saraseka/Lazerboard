name: Deploy all images
on: workflow_dispatch

env:
  REGISTRY: ghcr.io
  MIGRATIONS_IMAGE_NAME: ${{ github.actor }}/lazerboard-migrations:master
  SCOREFETCHER_IMAGE_NAME: ${{ github.actor }}/lazerboard-scorefetcher:master
  BACKEND_IMAGE_NAME: ${{ github.actor }}/lazerboard-backend:master
  FRONTEND_IMAGE_NAME: ${{ github.actor }}/lazerboard-frontend:master
  DISCORDHOOKS_IMAGE_NAME: ${{ github.actor }}/lazerboard-discordhooks:master
  EXTERNALAPIS_IMAGE_NAME: ${{ github.actor }}/lazerboard-externalapis:master

jobs:
  deploy:
    name: deploy containers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: copy docker-compose to server
        run: |
          scp ./compose.yaml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WORK_DIR }}/compose.yaml
      - name: Login
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "echo '${{ secrets.PAT }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
      - name: deploy container
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} &&
          docker compose pull && UID=$(id -u) GID=$(id -g) docker compose up -d"
      - name: Logout
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker logout ghcr.io"
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup-post-deploy
