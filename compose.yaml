networks:
  main:

services:
  migrations:
    image: ghcr.io/n-saraseka/lazerboard-migrations:latest
    depends_on:
      "db":
        condition: service_healthy
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - prod.env
    restart: on-failure:1
    networks:
      - main
  
  scorefetcher:
    image: ghcr.io/n-saraseka/lazerboard-scorefetcher:latest
    depends_on:
      "migrations":
        condition: service_completed_successfully
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      prod.env
    environment:
      - ASPNETCORE_URLS=http://+:8081
    volumes:
      - ./logs/scorefetcher:/app/Logs
      - ./BeatmapCache:/app/BeatmapCache
    restart: unless-stopped
    networks:
      - main
  
  backend:
    image: ghcr.io/n-saraseka/lazerboard-backend:latest
    depends_on:
      "migrations":
        condition: service_completed_successfully
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      prod.env
    volumes:
      - ./logs/backend:/app/Logs
      - ./keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
    networks:
      - main
  
  frontend:
    image: ghcr.io/n-saraseka/lazerboard-frontend:latest
    depends_on:
      "backend":
        condition: service_started
    volumes:
      - ./Caddy/data:/data
      - ./Caddy/config:/config
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - main
      
  db:
    image: postgres:18-alpine
    env_file:
      prod.env
    volumes:
      - ./db:/data/postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - main

volumes:
  static: